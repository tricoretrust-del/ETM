<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETM</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e4e2dc;
  --accent:#2f5d8a; --accent-ink:#ffffff; --warn:#a15c00; --warn-bg:#fff4e0; --ok:#2e7d4f; --ok-bg:#e8f4ec;
  --open:#8a3b2f; --chip:#f0eee9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161615; --panel:#1f1f1d; --ink:#ecebe7; --muted:#a09e98; --line:#33322f;
    --accent:#7fb0e0; --accent-ink:#0f1a26; --warn:#f0b35c; --warn-bg:#3a2c16; --ok:#7cc79a; --ok-bg:#1d3326;
    --open:#e8907f; --chip:#2a2927; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{font-size:15px;letter-spacing:.04em}
header .sum{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
header .sum button{all:unset;cursor:pointer;color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;height:calc(100vh - 45px)}
section{overflow:auto;padding:16px}
#left{border-right:1px solid var(--line)}
h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.title{font-weight:600;margin-bottom:4px}
.meta{color:var(--muted);font-size:12px}
textarea,input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.check{border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:6px;padding:8px 10px;margin:8px 0}
.check .q{font-weight:600}
.check .src{font-size:12px;color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:1px 8px;font-size:12px;margin:2px 4px 0 0}
.chip.open{color:var(--open)}
.chip.done{color:var(--ok)}
.day{margin-bottom:14px}
.day h3{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600;position:sticky;top:-16px;background:var(--bg);padding:4px 0}
.h{padding:7px 8px;border-radius:6px;cursor:pointer;border-bottom:1px solid var(--line)}
.h:hover{background:var(--panel)}
.h .t{font-size:12px;color:var(--muted);margin-right:6px}
.err{color:var(--open);font-size:13px;margin-top:6px;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;font-size:13px}
td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:34%}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
pre{white-space:pre-wrap;font-size:11px;background:var(--bg);padding:8px;border-radius:6px;overflow:auto}
.empty{color:var(--muted);font-size:13px}
.flag{font-size:11px;color:var(--warn)}
@media (max-width:760px){ main{grid-template-columns:1fr;height:auto} #left{border-right:none;border-bottom:1px solid var(--line)} section{padding:12px 16px} }
</style>
</head>
<body>
<header><b>ETM</b><div class="sum" id="sum"></div></header>
<main>
  <section id="left"></section>
  <section id="right"><h2>처리 이력</h2><div id="hist" class="empty">불러오는 중…</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => n == null ? "미확정" : n.toLocaleString("ko-KR") + "원";
let current = null;     // 현재 왼쪽에 열린 사건 id
let examples = {};

let ME = (()=>{ try{ return localStorage.getItem("etm-user") || "owner"; }catch(e){ return "owner"; } })();
function setMe(v){ ME = v; try{ localStorage.setItem("etm-user", v); }catch(e){} showLearning(); }
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
async function api(path, body){
  const h = {"X-ETM-User": ME};
  const r = await fetch(path, body === undefined ? {headers:h} : {method:"POST", headers:{...h, "Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.errors ? j.errors.join("\n") : j.error);
  return j;
}

// ---------------- 오른쪽: 요약 + 히스토리
async function refreshSide(){
  const [s, h] = await Promise.all([api("/api/summary"), api("/api/history")]);
  const stock = s.stock.map(x => `${esc(x.name)} ${x.qty.toLocaleString()}${esc(x.unit)}`).join(" · ");
  const pal = s.pallets_out.reduce((a,x)=>a+x.qty,0);
  const palF = (s.rental_factory||[]).reduce((a,x)=>a+x.qty,0);
  let L = {pending:0, candidates:[], stats:{asked:0, auto:0}};
  try{ L = await api("/api/learning"); }catch(e){}
  const todo = L.pending + L.candidates.length + (L.lags||[]).filter(x=>x.status==="awaiting").length
             + (L.plans||[]).filter(p=>p.status==="DRAFT").length;
  $("#sum").innerHTML =
    `<span title="${esc(stock)}">재고 ${s.stock.length}품목 <button onclick="showStock()">보기</button></span>`+
    `<span>받을 돈 ${won(s.receivable.known)}${s.receivable.undetermined_count?` + 미확정 ${s.receivable.undetermined_count}건`:""}</span>`+
    `<span>줄 돈 ${won(s.payable.known)}${s.payable.undetermined_count?` + 미확정 ${s.payable.undetermined_count}건`:""}</span>`+
    `<span>팔레트 공장 ${palF} · 현장 ${pal}</span>`+
    `<span><button onclick="showLearning()">RBK·PLN·LAG</button>${todo?` <b style="color:var(--warn)">${todo}</b>`:""}`+
    ` <span title="사용자에게 물은 판단 / 규칙이 처리한 판단">물음 ${L.stats.asked} · 자동 ${L.stats.auto}</span></span>`;
  window._summary = s;
  if(!h.days.length){ $("#hist").innerHTML = '<div class="empty">아직 처리한 기록이 없습니다.</div>'; return; }
  $("#hist").className = "";
  $("#hist").innerHTML = h.days.map(d => `<div class="day"><h3>${esc(d.date)} · ${d.items.length}건 처리</h3>`+
    d.items.map(i => `<div class="h" onclick="openEvent(${i.event_id})">`+
      `<span class="t">${esc(i.at.slice(11,16))}</span>${esc(i.summary)}`+
      (i.remaining.length ? `<div>${i.remaining.map(r=>`<span class="chip open">${esc(r.label)}${r.note?": "+esc(r.note):""}</span>`).join("")}</div>` : "")+
      `</div>`).join("") + `</div>`).join("");
}

function showStock(){
  const s = window._summary; current = null;
  $("#left").innerHTML = `<div class="card"><div class="title">현재 재고 (공장)</div><table>`+
    s.stock.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty.toLocaleString()} ${esc(x.unit)}</td></tr>`).join("")+
    `</table><div class="title" style="margin-top:12px">공장의 임대품 (소유자별)</div><table>`+
    ((s.rental_factory||[]).map(x=>`<tr><td>${esc(x.name)} · ${esc(x.owner_name||"소유자 미상")} 소유</td><td>${x.qty.toLocaleString()} ${esc(x.unit)}</td></tr>`).join("") || `<tr><td colspan=2>없음</td></tr>`)+
    `</table><div class="title" style="margin-top:12px">현장 체류 팔레트</div><table>`+
    (s.pallets_out.map(x=>`<tr><td>${esc(x.place)}</td><td>${x.qty}개</td></tr>`).join("") || `<tr><td colspan=2>없음</td></tr>`)+
    `</table><div class="title" style="margin-top:12px">남은 돈</div><table>`+
    (s.claims.map(c=>`<tr><td>${c.kind==="receivable"?"받을 돈":"줄 돈"} · ${esc(c.party_name)}</td><td><button class="link" onclick="openEvent(${c.event_id})">${won(c.amount)}</button></td></tr>`).join("") || `<tr><td colspan=2>없음</td></tr>`)+
    `</table><div class="row"><button onclick="home()">닫기</button></div></div>`;
}

// ---------------- 운영 RBK·LAG (DEV-002)
const LAG_ST = {open:"접수", verifying:"검증 중", awaiting:"판정 대기", closed:"종료", held:"보류"};
const OUT = {rule:"규칙 반영", narrowed:"범위 축소 반영", rejected:"기각"};
const V_ST = {pending:"승인 대기", active:"활성", suspended:"중지", superseded:"대체됨", retired:"폐기", draft:"초안"};
async function lcmd(cmd, body){
  try{ await api(`/api/learning/${cmd}`, {...body, request_id: rid()}); await showLearning(); }
  catch(e){ $("#err").textContent = e.message; window.scrollTo(0,0); }
}
function scopeText(r, v){
  const s = JSON.parse(v.scope||"{}"), c = JSON.parse(v.condition||"{}");
  const parts = [r.company_id ? "회사: 기본 회사" : "공통(모든 회사)", `사건: ${({shipment:"출하",receipt:"입고",intake:"자료 접수"})[r.event_kind]||r.event_kind}`];
  for(const [k,val] of Object.entries(s)) parts.push(`${({party_id:"거래처",site_id:"현장",item_id:"품목"})[k]} #${val}`);
  if(Object.keys(c).length) parts.push("조건: " + Object.values(c).join(" / "));
  return parts.join(" · ");
}
async function showLearning(){
  current = null;
  const o = await api("/api/learning");
  window._cands = o.candidates;
  const me = o.users.find(u=>u.id===ME) || {name:ME, role:"?"};
  const pend = o.rules.flatMap(r=>r.versions.filter(v=>v.status==="pending").map(v=>({r,v})));
  const live = o.rules.flatMap(r=>r.versions.filter(v=>v.status!=="pending").map(v=>({r,v})));
  $("#left").innerHTML = `<div class="row" style="margin:0 0 8px"><button class="link" onclick="home()">← 새 자료</button>
     <span class="meta" style="margin-left:auto">사용자</span><select onchange="setMe(this.value)">${o.users.map(u=>`<option value="${u.id}" ${u.id===ME?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div>
  <div class="err" id="err"></div>
  <div class="card"><div class="title">판단 위임 현황</div>
    <div class="meta">활성 규칙이 없는 판단은 사용자에게 묻습니다. 사례 → LAG → 검증 → 판정 → 승인을 거친 규칙만 자동으로 처리합니다.</div>
    <div style="margin-top:4px">물은 판단 <b>${o.stats.asked}</b> · 규칙이 처리 <b>${o.stats.auto}</b></div></div>
  ${pend.length?`<div class="card"><div class="title">승인 대기 규칙 버전</div>${pend.map(({r,v})=>`<div class="check">
      <div class="q">${esc(r.id)} v${v.version_no} — ${esc(r.title)}</div>
      <div class="src">${esc(scopeText(r,v))}</div><div class="src">동작: ${esc(v.description)}</div><div class="src">근거: ${esc(v.basis)}</div>
      <div class="row"><button class="primary" onclick="lcmd('approve',{version_id:${v.id}})">이 버전 승인·활성화</button><button onclick="lcmd('set_status',{version_id:${v.id},to:'retired'})">폐기</button><span class="meta">승인자: ${esc(me.name)}</span></div></div>`).join("")}</div>`:""}
  ${o.candidates.length?`<div class="card"><div class="title">반복된 판단 (후보 — 자동 등록 안 함)</div>${o.candidates.map((c,ci)=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">
      ${esc(c.label)}<div class="meta">${c.answers.map(a=>`${esc(typeof a.answer==="object"?a.answer.label:a.answer)} ${a.count}건`).join(" · ")}${c.consistent?"":" · 답이 엇갈림"}</div>
      <button class="link" onclick="regLag(${ci})">LAG로 등록하고 사례 검증 기록</button></div>`).join("")}</div>`:""}
  <div class="card"><div class="title">LAG — 검증 과제</div>${o.lags.length?o.lags.map(l=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">
      <span class="chip ${l.status==="awaiting"?"open":""}">${LAG_ST[l.status]||l.status}${l.outcome?" · "+(OUT[l.outcome]||l.outcome):""}</span> LAG-${l.id} ${esc(l.question)}
      <div class="meta">근거 ${l.links}건 · 검증 ${l.verifications.length}건${l.status_reason?" · "+esc(l.status_reason):""}${l.origin?" · 출처 "+esc(l.origin):""}</div>
      ${l.plans.length?`<div class="meta">실행계획: ${l.plans.map(p=>`<button class="link" onclick="showPlan(${p.id})">PLN-${p.id} ${esc(p.title)} (${PLN_ST[p.status]})</button>`).join(" ")}</div>`:""}
      ${l.status!=="closed"?`<button class="link" onclick="newPlan({lag:${l.id}})">+ 실행계획</button>`:""}
      <div class="row">${l.status==="awaiting"?`<button class="primary" onclick="judge(${l.id},'rule')">규칙 반영(승인 대기 버전 생성)</button><button onclick="judge(${l.id},'rejected')">기각</button><button onclick="judge(${l.id},'hold')">보류</button>`:""}
        ${["open","verifying","awaiting"].includes(l.status)&&l.case_ids.length?`<button onclick="lcmd('verify',{lag_id:${l.id},case_ids:${JSON.stringify(l.case_ids)},expected:'같은 상황에서 같은 답'})">사례 검증 기록</button>`:""}
        ${["open","verifying","awaiting"].includes(l.status)&&l.plans.some(p=>p.status==="DONE")?`<button onclick="verifyByPlans(${l.id},${JSON.stringify(l.plans.filter(p=>p.status==="DONE").map(p=>p.id))})">완료된 실행계획 결과로 검증 기록</button>`:""}
        ${["open","verifying"].includes(l.status)?`<button class="link" onclick="judge(${l.id},'hold')">보류</button>`:""}
        ${["closed","held"].includes(l.status)?`<button class="link" onclick="judge(${l.id},'reopen')">재개</button>`:""}</div>
      <details><summary>검증·이력</summary>${l.verifications.map(v=>`<div class="meta">검증#${v.id} ${esc(v.method)} · 기대: ${esc(v.expected)} · 관찰: ${esc(v.observed)}${v.limits?" · 한계: "+esc(v.limits):""} · 근거: ${esc((v.evidence||[]).join(", "))} · ${esc(v.actor)}</div>`).join("")}
        ${l.log.map(x=>`<div class="meta">${esc(x.at.slice(5,16).replace("T"," "))} ${esc(LAG_ST[x.from_status]||"-")} → ${esc(LAG_ST[x.to_status]||x.to_status)} ${esc(x.note||"")} (${esc(x.actor)})</div>`).join("")}</details>
    </div>`).join(""):'<div class="empty">없습니다.</div>'}</div>
  <div class="card"><div class="title">PLN — 실행계획</div>
    ${o.plans.length?o.plans.map(p=>planRow(p)).join(""):'<div class="empty">아직 없습니다. LAG 의 "+ 실행계획" 이나 아래에서 만드세요.</div>'}
    <div class="row"><button class="link" onclick="newPlan({})">+ 실행계획 직접 만들기</button></div></div>
  <div class="card"><div class="title">RBK — 규칙 버전</div>${live.length?live.map(({r,v})=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">
      <b>${esc(r.id)} v${v.version_no}</b> <span class="chip ${v.status==="active"?"done":""}">${V_ST[v.status]||v.status}</span> ${esc(v.description)}
      <div class="meta">${esc(scopeText(r,v))} · 적용 ${v.applied}건 · 근거: ${esc(v.basis)}</div>
      <div class="row">${v.status==="active"?`<button class="link" onclick="lcmd('set_status',{version_id:${v.id},to:'suspended'})">중지(다시 묻기)</button>`:""}
        ${v.status==="suspended"?`<button class="link" onclick="lcmd('set_status',{version_id:${v.id},to:'active'})">재개</button>`:""}
        <button class="link" onclick="traceV(${v.id})">근거 추적</button></div><div id="tr${v.id}"></div></div>`).join(""):'<div class="empty">아직 승인된 규칙이 없습니다.</div>'}</div>
  ${o.reclassification.length?`<div class="card"><div class="title">재분류 기록 (DEV-003)</div>${o.reclassification.map(r=>`<div class="meta" style="padding:2px 0">${esc(r.source_table)}#${r.source_id} → <b>${esc(r.target_layer)}</b> ${esc(r.target_ref||"")} · ${r.status==="done"?"완료":"TRNK 등록 대기"} · ${esc(r.reason)}</div>`).join("")}</div>`:""}
  <div class="card"><div class="title">기본 동작 (코드 고정 — 규칙 아님)</div>${o.code_defaults.map(r=>`<div class="meta" style="padding:2px 0">${esc(r.moved_to.replace(/^code-default/,""))}</div>`).join("")}</div>`;
  await refreshSide();
}
// ---------------- 운영 PLN (DEV-003)
const PLN_ST = {DRAFT:"초안", READY:"실행 지시됨", IN_PROGRESS:"진행 중", DONE:"완료", BLOCKED:"차단", DEFERRED:"보류", CANCELLED:"취소"};
async function pcmd(cmd, body, after){
  try{ await api(`/api/plans/${cmd}`, {...body, request_id: rid()}); after ? await after() : await showLearning(); }
  catch(e){ $("#err").textContent = e.message; window.scrollTo(0,0); }
}
function planActions(p){
  const b = (label, fn, cls="") => `<button class="${cls}" onclick="${fn}">${label}</button>`;
  const ev = p.version, id = p.id, r = (to) => `askReason(${id},'${to}',${ev})`;
  switch(p.status){
    case "DRAFT": return b("실행 지시", `pcmd('approve',{plan_id:${id},expected_version:${ev}})`, "primary") + b("취소", r("CANCELLED"));
    case "READY": return b("시작", `pcmd('transition',{plan_id:${id},to:'IN_PROGRESS',expected_version:${ev}})`, "primary") + b("차단", r("BLOCKED")) + b("보류", r("DEFERRED")) + b("취소", r("CANCELLED"));
    case "IN_PROGRESS": return b("완료 등록", `completePlan(${id},${ev})`, "primary") + b("차단", r("BLOCKED")) + b("보류", r("DEFERRED")) + b("취소", r("CANCELLED"));
    case "BLOCKED": case "DEFERRED": return b("재개", r("READY")) + b("취소", r("CANCELLED"));
    case "DONE": return b("재개", `reopenPlan(${id},${ev})`);
  }
  return "";
}
function planRow(p){
  return `<div style="padding:6px 0;border-bottom:1px solid var(--line)">
    <span class="chip ${p.status==="DONE"?"done":(p.status==="DRAFT"?"open":"")}">${PLN_ST[p.status]}</span> <button class="link" onclick="showPlan(${p.id})">PLN-${p.id}</button> ${esc(p.title)}
    <div class="meta">조치: ${esc(p.action||"미정")} · 완료 조건: ${esc(p.done_criteria||"미정")}${p.assignee?" · 담당 "+esc(p.assignee):""}${p.due_date?" · 기한 "+esc(p.due_date):""}${p.status_reason?" · 사유: "+esc(p.status_reason):""}</div>
    ${p.result?`<div class="meta">결과: ${esc(p.result)}</div>`:""}
    <div class="meta">연결: ${p.links.filter(l=>!l.removed_at).map(l=>`${({basis:"근거",target:"대상",evidence:"증빙"})[l.role]} ${esc(l.target)}`).join(" · ")||"없음"}</div>
    <div class="row">${planActions(p)}</div></div>`;
}
async function showPlan(id){
  current = null;
  const p = await api(`/api/plans/${id}`);
  $("#left").innerHTML = `<div class="row" style="margin:0 0 8px"><button class="link" onclick="showLearning()">← RBK·PLN·LAG</button></div>
    <div class="err" id="err"></div>
    <div class="card"><div class="title">PLN-${p.id} ${esc(p.title)}</div>

async function newPlan(ctx){

  const action = prompt("조치 내용 (비워 두면 미정)", "") || null;

let LLM = "off";

async function showDialogList(){

function busy(on){ const b=$("#dbusy"); if(b) b.hidden=!on; document.querySelectorAll("#left button").forEach(x=>x.disabled=on); }

async function dcand(did, cid, act){

       if(act==="accept") $("#derr").textContent = r.rule_id ? `규칙 ${r.rule_id} 등록됨${r.status==="active"?" (바로 적용)":" (승인 대기)"}` : "등록됨";

function showDialog(d){
  current = null;
  const q = d.open_question;
  const qa = d.questions.filter(x=>x.status!=="open").map(x=>{
    const a = d.answers.filter(y=>y.question_id===x.id).pop();
    return `<div class="meta" style="margin-top:6px">물음: ${esc(x.text)}</div><div>답: ${esc(a?a.raw_text:"(다른 질문으로 대체됨)")}</div>`;
  }).join("");
  let body = "";
  if(q){
    body = `<div class="check"><div class="q">${esc(q.text)}</div>`+
      `<div class="row">${q.options.map(o=>`<button onclick='dsend(${d.id},${q.id},${d.revision},${esc(JSON.stringify(o))})'>${esc(o)}</button>`).join("")}</div>`+
      `<div class="row"><input id="dans" style="flex:1;min-width:200px" placeholder="말로 답해도 됩니다 (예: LOGISALL에서 팔레트 들어온 거야)"`+
      ` onkeydown="if(event.key==='Enter')dsend(${d.id},${q.id},${d.revision})">`+
      `<button class="primary" onclick="dsend(${d.id},${q.id},${d.revision})">답하기</button></div></div>`;
  } else if(d.status==="applied" || d.status==="kept"){
    const conf = (d.state && d.state.confirmations) || {};
    const EV = {document:"원문 표기", document_name:"원문의 업체명", document_value:"원문의 숫자", master_exact:"기준정보 일치",
      sender_is_owner:"보낸 업체가 등록 소유자", user_answer:"이번 답변", rbk:"승인된 규칙", model_reading:"자료 해석(확인 안 됨)"};
    const SL = k => k==="kind"?"종류":k==="counterparty"?"상대 업체":k.replace(/lines\.(\d+)\.(\w+)/,(m,i,f)=>`${+i+1}번 줄 ${({qty:"수량",item:"품목",owner:"소유자"})[f]||f}`);
    const rows = Object.entries(conf).filter(([k,v])=>v).map(([k,v])=>`<tr><td>${esc(SL(k))}</td><td>${esc(EV[v.evidence]||v.evidence)}</td></tr>`).join("");
    body = `<div class="check" style="border-color:var(--ok);background:var(--ok-bg)"><div class="q">${d.status==="applied"?"반영했습니다.":"재고와 무관한 자료로 보관했습니다."}</div>`+
      (rows?`<details><summary>무엇으로 확정했나</summary><table>${rows}</table></details>`:"")+
      (d.event_id?`<div class="row"><button class="primary" onclick="openEvent(${d.event_id})">처리 내용 보기</button></div>`:"")+`</div>`;
  } else if(d.status==="failed"){
    body = `<div class="check"><div class="q">자료를 해석하지 못해 반영을 보류했습니다. 원문과 답변은 그대로 남아 있습니다.</div>`+
      `<details><summary>자세히</summary><div class="meta">${esc(d.status_reason||"")}</div></details>`+
      `<div class="row"><button class="primary" onclick="dretry(${d.id})">다시 해석</button></div></div>`;
  }
  const cands = d.candidates.filter(c=>c.status==="suggested").map(c=>
    `<div class="card" style="margin:6px 0"><div>${esc(c.text)}</div>`+
    (c.kind==="rbk" && !c.explicit_instruction ? `<div class="meta">일반화 지시가 없어 규칙으로 바로 등록할 수 없습니다.</div>`
      : `<div class="row"><button class="primary" onclick="dcand(${d.id},${c.id},'accept')">${CAND[c.kind]||"등록"}</button>`+
        `<button onclick="dcand(${d.id},${c.id},'dismiss')">무시</button></div>`)+`</div>`).join("");
  const done = d.candidates.filter(c=>c.status==="accepted").map(c=>`<span class="chip done">${esc(c.text.slice(0,40))}</span>`).join("");
  $("#left").innerHTML = `<div class="row" style="margin:0 0 8px"><button class="link" onclick="home()">← 새 자료</button></div>
    <h2>자료 문답 #${d.id} · ${D_ST[d.status]||esc(d.status)}</h2><div class="card">
    ${d.hypothesis?`<div class="meta">읽은 내용: ${esc(d.hypothesis.description)}</div>`:""}
    <details><summary>원문</summary><pre>${esc(d.raw_input)}</pre></details>
    ${qa}${body}<div id="dbusy" class="meta" hidden>생각하는 중…</div><div class="err" id="derr"></div></div>
    ${cands?`<h2>학습 제안</h2>${cands}`:""}${done?`<div>${done}</div>`:""}`;
  refreshSide();
}

      ${readOnly?"":`<div class="meta" style="margin-top:6px">숫자 옆 <b>수정</b>을 누르면 차이만 다시 반영합니다(이력 보존).</div>`}
    </details>
    <div class="meta" style="margin-top:6px">${(d.plans||[]).map(p=>`<button class="link" onclick="showPlan(${p.id})">PLN-${p.id} ${esc(p.title)} (${PLN_ST[p.status]})</button>`).join(" ")}
      <button class="link" onclick="newPlan({event:${d.id}})">+ 실행계획</button>
      <button class="link" onclick="newLag(${d.id})">+ LAG(질문)</button></div>
    ${(d.rule_applications||[]).length?`<details><summary>규칙 적용 근거 ${d.rule_applications.length}건</summary>${d.rule_applications.map(a=>`<div class="meta">${esc(a.rule)} · ${esc(a.target)} · ${esc(({performed:"자동 처리",required_confirm:"확인 요구",held_conflict:"충돌로 보류"})[a.result]||a.result)} · ${esc(a.reason)} · 사건 리비전 ${a.event_revision}</div>`).join("")}</details>`:""}
    <details><summary>원본·처리 이력</summary>
      ${d.history.map(h=>`<div class="meta">${esc(h.at.replace("T"," ").slice(5,16))} ${esc(h.summary)}</div>`).join("")}
      ${d.moves.length?`<div class="meta" style="margin-top:6px"><b>가치 이동</b></div>`+d.moves.map(m=>`<div class="meta">${esc(m.created_at.slice(5,16).replace("T"," "))} ${esc(m.item_name)} ${m.qty>0?"":"(조정) "}${m.qty} ${esc(m.unit)} · ${esc(m.from_loc)}→${esc(m.to_loc)} · ${esc(m.reason)}</div>`).join(""):""}
      ${d.intakes.map(i=>`<details><summary>${esc(i.channel)} ${esc(i.input_id)} · ${esc(i.outcome)} ${i.source_ref?"· "+esc(i.source_ref):""}</summary><pre>${esc(JSON.stringify(JSON.parse(i.payload),null,2))}</pre></details>`).join("")}
    </details>
   </div>`;
  await refreshSide();
}

let readOnly = false;   // 보관만 한 문서는 수정 버튼을 숨긴다
function row(label, value, path, raw){
  const edit = !readOnly && path && ["lines","pallets","transport"].some(p=>path.startsWith(p))
    ? ` <button class="link" onclick="editVal('${path}', ${JSON.stringify(raw??null)})">수정</button>` : "";
  return `<tr><td>${esc(label)}</td><td>${esc(value??"-")}${edit}</td></tr>`;
}
async function editVal(path, cur){
  const nv = prompt("새 값", cur ?? ""); if(nv===null) return;
  try{ await api(`/api/events/${current}/revise`, {changes:{[path]: nv===""?null:Number(nv)}}); await openEvent(current); }
  catch(e){ $("#err").textContent = e.message; }
}

function renderCheck(c){
  const d = c.detail, id = c.id;
  let body = "";
  const inp = (val, ph="", type="text") => `<input id="in${id}" type="${type}" value="${esc(val??"")}" placeholder="${esc(ph)}" size="18">`;
  switch(c.kind){
    case "verify":
      body = `<div class="src">원본 판독: <b>${esc(d.raw)}</b> · 추출값: <b>${esc(d.extracted)}</b></div>
        <div class="row">${d.extracted!=null?`<button class="primary" onclick="ans(${id},{choice:'ok'})">맞음</button>`:""}${inp(d.extracted)}<button onclick="ansVal(${id})">이 값으로</button></div>`; break;
    case "missing":
      body = `<div class="row">${inp("", "", c.path.endsWith("qty")?"number":"text")}<button class="primary" onclick="ansVal(${id})">확인</button></div>`; break;
    case "match":
      body = `<div class="row">${(d.candidates||[]).map(x=>`<button onclick="ans(${id},{choice:'${x.choice}'})">${esc(x.label)}</button>`).join("")}</div>
        <div class="row"><span class="meta">새로 등록:</span>${inp(d.input)}${c.path.endsWith(".item")?`<input id="unit${id}" placeholder="단위" size="5">`:""}<button onclick="ansNew(${id})">등록</button></div>`; break;
    case "contact":
      body = `<div class="row">${(d.candidates||[]).map((x,i)=>`<button onclick="ans(${id},{choice:'${i}'})">${esc(x.name)} ${esc(x.phone||"")}<span class="meta"> (${esc(x.trade_date||"")})</span></button>`).join("")}
        ${d.input&&d.input.name?`<button class="primary" onclick="ans(${id},{choice:'keep'})">${esc(d.input.name)} 유지(새 담당자)</button>`:""}</div>
        <div class="row">${inp("", "이름")}<input id="ph${id}" placeholder="전화" size="14"><button onclick="ans(${id},{value:{name:$('#in${id}').value, phone:$('#ph${id}').value}})">입력</button></div>`; break;
    case "unit":
      body = `<div class="row"><button class="primary" onclick="ans(${id},{choice:'item_unit'})">${esc(d.item_unit)}(으)로 본다</button><button onclick="ans(${id},{choice:'keep'})">${esc(d.input)} 유지</button></div>`; break;
    case "stock":
      body = `<div class="row"><button class="primary" onclick="ans(${id},{choice:'ok'})">알고 진행</button>${inp("", "수량 수정", "number")}<button onclick="ansVal(${id})">수량 수정</button></div>`; break;
    case "pallet_mismatch":
      body = `<div class="row"><button onclick="ans(${id},{choice:'invoice'})">송장 ${d.invoice}개</button><button onclick="ans(${id},{choice:'message'})">상차 메시지 ${d.message}개</button>${inp("", "실제 수량", "number")}<button onclick="ansVal(${id})">입력</button><span class="meta">나중에 해도 제품 출하 반영은 유지됩니다</span></div>`; break;
    case "pallet_confirm":
      body = `<div class="row"><button class="primary" onclick="ans(${id},{choice:'ok'})">${d.invoice}개 맞음</button>${inp("", "실제 수량", "number")}<button onclick="ansVal(${id})">입력</button></div>`; break;
    case "pallet_missing":
      body = `<div class="row">${inp(d.invoice??d.message, "확정 수량", "number")}<button onclick="ansVal(${id})">확정</button><span class="meta">자료가 오면 확정하세요. 그때까지 팔레트 확인 미결</span></div>`; break;
    case "doc_kind": {
      const sug = d.suggestion ? d.suggestion.answer : null;
      const why = d.suggestion ? `지난 답: ${d.choices.find(x=>x.choice===sug)?.label} (${d.suggestion.count}/${d.suggestion.total}건)${d.suggestion.conflict?" · 답이 엇갈렸음":""}`
                : (d.hint ? `참고: ${d.choices.find(x=>x.choice===d.hint.answer)?.label} 같음 — ${d.hint.why}` : "");
      body = `<div class="src">${esc(d.decision_label)}</div>${why?`<div class="src">${esc(why)}</div>`:""}
        <div class="row">${d.choices.map(x=>`<button class="${x.choice===sug?"primary":""}" onclick="ans(${id},{choice:'${x.choice}'})">${esc(x.label)}</button>`).join("")}</div>`; break; }
    case "item_map": {
      const sug = d.suggestion ? d.suggestion.answer.choice : null;
      body = `${d.suggestion?`<div class="src">지난 답: ${esc(d.suggestion.answer.label)} (${d.suggestion.count}/${d.suggestion.total}건)</div>`:""}
        <div class="row">${d.candidates.map(x=>`<button class="${x.choice===sug?"primary":""}" onclick="ans(${id},{choice:'${x.choice}'})">${esc(x.label)}</button>`).join("")}</div>`; break; }
    case "identity":
      body = `<div class="src">기존: ${esc(d.other_title)}</div>${(d.diffs||[]).length&&d.mode==="revision_candidate"?`<div class="src">${d.diffs.map(x=>`${esc(x.label)}: ${esc(x.old)} → ${esc(x.new)}`).join(" · ")}</div>`:""}
        <div class="row"><button class="primary" onclick="ans(${id},{choice:'same'})">${d.mode==="revision_candidate"?"같은 출하 — 차이만 반영":"같은 출하 — 반영 안 함"}</button><button onclick="ans(${id},{choice:'separate'})">별개 출하</button></div>`; break;
  }
  const why = d.why || c.rule_id || "";
  return `<div class="check"><div class="q">${esc(c.message)}</div>${why?`<div class="flag">${esc(why)}</div>`:""}${body}</div>`;
}
async function ans(id, a){
  try{ const r = await api(`/api/events/${current}/answers`, {answers:{[id]:a}}); await openEvent(r.event_id); }
  catch(e){ $("#err").textContent = e.message; }
}
function ansVal(id){ const el=$("#in"+id); const v = el.type==="number" ? (el.value===""?null:Number(el.value)) : el.value; return ans(id,{value:v}); }
function ansNew(id){ const u=$("#unit"+id); return ans(id,{choice:"new", value:$("#in"+id).value, unit:u?u.value:undefined}); }

(async()=>{ examples = await api("/api/examples"); home(); await refreshSide(); })();
</script>
</body>
